<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>별 어디있니</title>
  <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000508; width: 100%; height: 100vh; overflow: hidden; }
  #scope { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 2.5rem; }
  #hud { position: fixed; top: 20px; left: 20px; color: rgba(180,220,255,0.8); font-family: monospace; display: flex; flex-direction: column; gap: 4px; }
  #dir { font-size: 1.4rem; font-weight: 300; letter-spacing: 0.2em; }
  #coords { font-size: 0.75rem; opacity: 0.6; }
  #startBtn {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(180,220,255,0.15);
    color: rgba(180,220,255,0.9);
    border: 1px solid rgba(180,220,255,0.4);
    font-family: monospace;
    font-size: 1rem;
    padding: 14px 28px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.1em;
  }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div id="scope">🔭</div>
  <div id="hud">
    <span id="dir">N</span>
    <span id="coords">Az 0° · El 45°</span>
  </div>
  <button id="startBtn">🔭 하늘 보기</button>

<script>
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const stars = [
    { x: 0.2, y: 0.3, r: 2, brightness: 1.0 },
    { x: 0.5, y: 0.2, r: 1.5, brightness: 0.8 },
    { x: 0.7, y: 0.4, r: 3, brightness: 1.0 },
    { x: 0.3, y: 0.6, r: 1, brightness: 0.6 },
    { x: 0.8, y: 0.15, r: 2.5, brightness: 0.9 },
  ];

  let azimuth = 0, targetAz = 0;
  let elevation = 45, targetEl = 45;

  function startSensor() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(res => {
        if (res === 'granted') {
          window.addEventListener('deviceorientation', onOrientation);
          document.getElementById('startBtn').style.display = 'none';
        }
      });
    } else {
      window.addEventListener('deviceorientation', onOrientation);
      document.getElementById('startBtn').style.display = 'none';
    }
  }

  document.getElementById('startBtn').addEventListener('click', startSensor);

  function onOrientation(e) {
  // iOS 사파리: webkitCompassHeading이 실제 나침반 방향
  if (e.webkitCompassHeading !== undefined) {
    targetAz = e.webkitCompassHeading;
  } else if (e.alpha !== null) {
    targetAz = 360 - e.alpha; // Android 보정
  }

  if (e.beta !== null) {
    targetEl = 90 - Math.max(0, Math.min(90, e.beta));
  }

  const dirs = ['N','NE','E','SE','S','SW','W','NW','N'];
  document.getElementById('dir').textContent = dirs[Math.round(targetAz / 45) % 8];
  document.getElementById('coords').textContent =
    `Az ${Math.round(targetAz)}° · El ${Math.round(targetEl)}°`;
}

  function drawStar(x, y, r, brightness) {
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r*3);
    grad.addColorStop(0, `rgba(255,255,255,${brightness})`);
    grad.addColorStop(1, `rgba(255,255,255,0)`);
    ctx.beginPath();
    ctx.arc(x, y, r*3, 0, Math.PI*2);
    ctx.fillStyle = grad;
    ctx.fill();
  }

  function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 360도 경계 처리
  let diff = targetAz - azimuth;
  if (diff > 180) diff -= 360;
  if (diff < -180) diff += 360;
  azimuth += diff * 0.2;
  if (azimuth < 0) azimuth += 360;
  if (azimuth >= 360) azimuth -= 360;

  elevation = targetEl;

  stars.forEach(star => {
    const offsetX = (azimuth / 360) * canvas.width;
    const px = ((star.x * canvas.width) - offsetX + canvas.width) % canvas.width;

    const offsetY = ((90 - elevation) / 90) * (canvas.height * 0.5);
    const py = star.y * canvas.height + offsetY - canvas.height * 0.25;

    if (py < -20 || py > canvas.height + 20) return;

    drawStar(px, py, star.r, star.brightness);
  });

  requestAnimationFrame(draw);
}
  draw();
</script>
</body>
</html>
