  #coords { font-size: 0.75rem; opacity: 0.6; }
  #info {
    margin-top: 8px; padding: 8px 12px;
    background: rgba(180,220,255,0.08);
    border: 1px solid rgba(180,220,255,0.25);
    border-radius: 8px;
    display: none;

  #infoKind { font-size: 0.7rem; opacity: 0.6; margin-left: 6px; }
  #infoPos { font-size: 0.8rem; margin-top: 4px; opacity: 0.85; }
  #infoHint { font-size: 0.7rem; margin-top: 4px; opacity: 0.5; display: none; }
  #compass {
    position: fixed; top: 16px; right: 16px;
    width: 56px; height: 56px; padding: 0;
    border-radius: 50%;
    background: rgba(180,220,255,0.08);
    border: 1.5px solid rgba(180,220,255,0.7);
    cursor: pointer;
    transition: border-color 0.3s, background 0.3s;
  }
  #compass svg { width: 100%; height: 100%; display: block; }
  #compass.free { border-color: rgba(180,220,255,0.2); background: rgba(180,220,255,0.03); }
  /* 모드 전환: [AR | 자유] 중 지금 모드가 밝게 */
  #modeBtn {
    position: fixed; top: 82px; right: 16px;
    display: flex; padding: 2px; border-radius: 14px;
    background: rgba(180,220,255,0.06);
    border: 1px solid rgba(180,220,255,0.4);
    font-family: monospace; font-size: 0.75rem;
    cursor: pointer;
  }
  #modeBtn span {
    padding: 4px 9px; border-radius: 11px;
    color: rgba(200,230,255,0.45);
    transition: background 0.25s, color 0.25s;
  }
  #modeBtn span.on { background: rgba(180,220,255,0.85); color: #04101c; }
  #constBtn {
    position: fixed; top: 120px; right: 16px;

    border: 1px solid rgba(180,220,255,0.5);
    color: rgba(200,230,255,0.9);
    font-family: monospace; font-size: 0.75rem;
    cursor: pointer;
  }

    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(180,220,255,0.15);
    color: rgba(180,220,255,0.9);
    border: 1px solid rgba(180,220,255,0.4);
    font-family: monospace;
    font-size: 1rem;
    padding: 14px 28px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.1em;
  }

// =====================

// =====================
let azimuth = 0, targetAz = 0;
let elevation = 45, targetEl = 45;

// =====================
// 4. 시작 버튼
// =====================
document.getElementById('startBtn').addEventListener('click', () => {
  // GPS 요청
  navigator.geolocation.getCurrentPosition(

      userLat = pos.coords.latitude;
      userLon = pos.coords.longitude;
      gpsReady = true;
    },

  );

  // 센서 요청
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {

      if (res === 'granted') {

// =====================
// 화면 이동: 드래그(상하=고도, 좌우=방위각), PC는 마우스 휠
// - AR 모드(followCompass=true): 방위각은 나침반을 따라감
// - 좌우로 끌면 자유 모드로 전환, 나침반 버튼을 누르면 다시 AR 모드
// =====================
let followCompass = true;   // true: AR 모드, false: 자유 모드
let compassHeading = null;  // 센서가 알려준 최신 방위각 (PC는 null)
let sensorEl = null;        // 센서가 알려준 최신 고도 (PC는 null)

let lastX = null, lastY = null, dragDX = 0, dragDY = 0;
// 이 거리(px) 이하로 움직이면 '탭', 넘으면 '드래그' (손떨림 감안)
const TAP_SLOP = 12;
// 손가락 보정: 터치는 실제 닿는 중심이 '노린 곳'보다 오른쪽 아래로 잡힘
// 빨간 점이 손끝에 오도록 숫자를 조절 (px, 양수 = 왼쪽/위로 당김)
const TOUCH_OFFSET = { x: 14, y: -30 };
// 화면 비율 우주:지구 = 8:2 → 지평선이 화면 위에서 80% 지점 아래로는 안 올라오게 (시야 60° 기준 고도 18°)
const HORIZON_STOP = 0.8;
const EL_MIN = 60 * (HORIZON_STOP - 0.5);
const clampEl = v => Math.max(EL_MIN, Math.min(90, v));
// AR도 같은 하한 사용: 폰을 지평선보다 낮게 향해도 화면은 8:2 유지 (천체 위치는 지평선 기준으로 정확함)
const clampElAR = clampEl;
const normAz = v => ((v % 360) + 360) % 360;
const DEG_PER_PX_X = () => 60 / canvas.width;   // 시야 60° 기준
const DEG_PER_PX_Y = () => 60 / canvas.height;

canvas.addEventListener('pointerdown', e => {
  lastX = e.clientX; lastY = e.clientY; dragDX = 0; dragDY = 0;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (lastX === null) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;

  // AR 모드에서 TAP_SLOP 이상 끌면 자유 모드로 전환 (탭할 때 손이 살짝 밀리는 건 무시)
  dragDX += dx; dragDY += dy;
  if (followCompass && Math.hypot(dragDX, dragDY) > TAP_SLOP) followCompass = false;

  // 자유 모드: 상하=고도, 좌우=방위각 (손가락을 따라 하늘이 움직임)
  if (!followCompass) {
    targetEl = clampEl(targetEl + dy * DEG_PER_PX_Y());
    targetAz = normAz(targetAz - dx * DEG_PER_PX_X());
  }
});
const endDrag = () => { lastX = null; lastY = null; };
canvas.addEventListener('pointerup', e => {
  // 거의 안 움직였으면 드래그가 아니라 탭 → 천체 선택
  if (lastX !== null && Math.hypot(dragDX, dragDY) <= TAP_SLOP) {
    const touch = e.pointerType === 'touch';
    selectAt(e.clientX - (touch ? TOUCH_OFFSET.x : 0),
             e.clientY - (touch ? TOUCH_OFFSET.y : 0));
  }
  endDrag();
});
canvas.addEventListener('pointercancel', endDrag);

// =====================
// 천체 탭 선택
// hitTargets: 이번 프레임에 화면에 그려진 천체 목록 (draw에서 채움)
// =====================
let hitTargets = [];
let selected = null;   // { name, kind, getPos, nearby }

// hitR: 탭 인정 범위 (= 선택 링 크기 ringR과 같게 맞춤), coreR: 실제로 그려진 몸체 크기
// 1) 몸체 위를 정확히 탭했으면 그 천체가 최우선
// 2) 아니면 탭 지점에서 가장 가까운 천체
// 3) 후보가 여럿이면 같은 자리를 다시 탭할 때마다 다음 후보로 넘어감
let lastTap = null;   // DEBUG_TAP용: 마지막 탭 위치

function selectAt(x, y) {
  lastTap = { x, y, t: performance.now() };
  if (y > panelTop()) return;   // 지구 영역을 누르면 무시 (선택 유지)
  const cands = hitTargets
    .map(t => ({ t, d: Math.hypot(t.px - x, t.py - y) }))
    .filter(c => c.d < c.t.hitR && c.t.py < panelTop())   // 지구 영역 뒤에 가려진 천체는 제외
    .sort((a, b) => ((a.d > a.t.coreR) - (b.d > b.t.coreR)) || (a.d - b.d));

  // 빈 하늘을 탭하면 선택 해제
  if (cands.length === 0) { selected = null; return; }

  let idx = 0;
  if (selected) {
    const i = cands.findIndex(c => c.t.name === selected.name);
    if (i >= 0) idx = (i + 1) % cands.length;
  }
  const t = cands[idx].t;
  selected = { name: t.name, kind: t.kind, getPos: t.getPos, nearby: cands.length - 1 };
}

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  followCompass = false;   // 휠/트랙패드를 쓰면 자유 모드
  targetEl = clampEl(targetEl - e.deltaY * 0.05);
  targetAz = normAz(targetAz + e.deltaX * 0.05);
}, { passive: false });

// 나침반 버튼: 내가 실제로 보는 방향으로 다시 맞추고 AR 모드로 복귀
// AR 모드로 복귀: 내가 실제로 보는 방향으로 화면을 다시 맞춤
function enterAR() {
  followCompass = true;
  if (compassHeading !== null) {
    targetAz = compassHeading;
    if (sensorEl !== null) targetEl = clampElAR(sensorEl);
  } else {
    targetAz = 0;   // 센서 없는 PC: 북쪽으로 정렬
  }
}

// 나침반 버튼: AR 모드로 복귀
document.getElementById('compass').addEventListener('click', enterAR);

// 모드 버튼: AR ↔ 자유 전환
document.getElementById('modeBtn').addEventListener('click', () => {
  if (followCompass) followCompass = false;
  else enterAR();
});

let rawSensor = null;   // 디버그용: 센서 원본 값

// =====================
// 센서 → 카메라 방향 계산
// 폰의 세 축 회전(α 좌우 회전, β 앞뒤 기울기, γ 옆 기울기)으로 회전 행렬을 만들고,
// 폰 뒷면(카메라)이 향하는 벡터를 구해 방위각/고도로 바꿈.
// iOS heading은 '폰 윗변이 가리키는 방향'이라 수직보다 뒤로 젖히면 180° 뒤집힘 → 직접 쓰지 않고,
// 폰이 덜 기울었을 때만(믿을 수 있을 때) α의 북쪽 기준(alphaOffset)을 맞추는 데 사용
// =====================
let alphaOffset = null;
const angDiff = (a, b) => ((a - b + 540) % 360) - 180;   // a - b 를 -180~180 범위로

function cameraDirection(alphaDeg, betaDeg, gammaDeg) {
  const a = toRad(alphaDeg), b = toRad(betaDeg), g = toRad(gammaDeg);
  const sA = Math.sin(a), cA = Math.cos(a), sB = Math.sin(b), cB = Math.cos(b), sG = Math.sin(g), cG = Math.cos(g);
  // 카메라 방향 = 폰의 -z축 (동쪽 x, 북쪽 y, 위쪽 z)
  const vx = -(cA * sG + sA * sB * cG);
  const vy = cA * sB * cG - sA * sG;
  const vz = -cB * cG;
  return {
    az: normAz(toDeg(Math.atan2(vx, vy))),
    el: toDeg(Math.asin(Math.max(-1, Math.min(1, vz)))),
  };
}

function onOrientation(e) {
  rawSensor = { a: e.alpha, b: e.beta, g: e.gamma, h: e.webkitCompassHeading, acc: e.webkitCompassAccuracy };
  if (e.alpha === null || e.beta === null || e.gamma === null) return;

  let absAlpha;
  const h = e.webkitCompassHeading;
  if (h !== undefined && h !== null) {
    // iOS: 폰이 수직보다 덜 기울었을 때(|β| < 70°) heading = 360 - (북쪽 기준 α) 가 성립 → 기준값 갱신
    if (Math.abs(e.beta) < 70) {
      const off = normAz(360 - h - e.alpha);
      alphaOffset = alphaOffset === null ? off : normAz(alphaOffset + 0.1 * angDiff(off, alphaOffset));
    }
    if (alphaOffset === null) {
      // 아직 기준을 못 잡음(처음부터 뒤로 젖힌 상태): heading 뒤집힘만 보정해서 임시로 사용
      compassHeading = e.beta > 90 ? normAz(h + 180) : h;
      sensorEl = Math.max(-90, Math.min(90, e.beta - 90));
      applySensor();
      return;
    }
    absAlpha = e.alpha + alphaOffset;
  } else {
    absAlpha = e.alpha;   // 안드로이드 등: α를 그대로 사용
  }

  const dir = cameraDirection(absAlpha, e.beta, e.gamma);
  compassHeading = dir.az;
  sensorEl = dir.el;
  applySensor();
}

// AR 모드일 때만 화면이 센서를 따라감 (방위각 + 고도)
function applySensor() {
  if (!followCompass) return;
  if (compassHeading !== null) targetAz = compassHeading;
  if (sensorEl !== null) {
    // 급격한 변화 방지: 한 번에 10도 이상 안 바뀌게
    const d = clampElAR(sensorEl) - targetEl;
    targetEl += Math.max(-10, Math.min(10, d));
  }
}

// HUD + 나침반 갱신 (draw에서 매 프레임 호출, 센서 없는 PC에서도 동작)
const DIRS = ['북','북동','동','남동','남','남서','서','북서'];
const dirName = az => DIRS[Math.round(normAz(az) / 45) % 8];

function updateHud() {
  // 센서 원본 값 (DEBUG_TAP일 때만): alpha/beta/gamma = 폰 회전, heading = 나침반, acc = 나침반 오차(도)
  const sd = document.getElementById('sensorDebug');
  if (DEBUG_TAP && rawSensor) {
    const f = v => (v === undefined || v === null) ? '-' : Math.round(v);
    sd.textContent = `α ${f(rawSensor.a)}  β ${f(rawSensor.b)}  γ ${f(rawSensor.g)}\nheading ${f(rawSensor.h)}  오차 ±${f(rawSensor.acc)}°`;
  } else {
    sd.textContent = '';
  }
  document.getElementById('dir').textContent = dirName(azimuth);
  document.getElementById('coords').textContent =
    `${followCompass ? 'AR' : '자유'} · 방위각 ${Math.round(azimuth)}° · 고도 ${Math.round(elevation)}°`;

  // 선택한 천체 정보 (매 프레임 다시 계산 → 시간이 지나면 값도 바뀜)
  const info = document.getElementById('info');
  if (selected) {
    const p = selected.getPos();
    document.getElementById('infoName').textContent = selected.name;
    document.getElementById('infoKind').textContent = selected.kind;
    document.getElementById('infoPos').textContent =
      `방위각 ${Math.round(normAz(p.az))}° (${dirName(p.az)}) · 고도 ${Math.round(p.alt)}°`;
    const hint = document.getElementById('infoHint');
    if (selected.nearby > 0) {
      hint.textContent = `근처에 ${selected.nearby}개 더 있어요 · 같은 곳을 다시 탭하면 전환`;
      hint.style.display = 'block';
    } else {
      hint.style.display = 'none';
    }
    info.style.display = 'block';
  } else {
    info.style.display = 'none';
  }
  // 바늘의 N이 화면 기준으로 실제 북쪽을 가리키게
  document.getElementById('needle').setAttribute('transform', `rotate(${-azimuth} 28 28)`);
  document.getElementById('compass').classList.toggle('free', !followCompass);
  document.getElementById('modeAR').classList.toggle('on', followCompass);
  document.getElementById('modeFree').classList.toggle('on', !followCompass);
}

// =====================
// 5. 천체 좌표 계산 (RA/Dec → Alt/Az)
// =====================
function toRad(deg) { return deg * Math.PI / 180; }
function toDeg(rad) { return rad * 180 / Math.PI; }

function getJulianDate() {
  return Date.now() / 86400000 + 2440587.5;
}

function getMoonPosition(lat, lon) {
  const jd = getJulianDate();
  const n = jd - 2451545.0;
  const L = (218.316 + 13.176396 * n) % 360;
  const M = toRad((134.963 + 13.064993 * n) % 360);
  const F = toRad((93.272 + 13.229350 * n) % 360);
  const lambda = toRad(L + 6.289 * Math.sin(M));
  const beta = toRad(5.128 * Math.sin(F));
  const epsilon = toRad(23.439 - 0.0000004 * n);
  const ra = toDeg(Math.atan2(
    Math.cos(epsilon) * Math.sin(lambda) - Math.tan(beta) * Math.sin(epsilon),
    Math.cos(lambda)
  ));
  const dec = toDeg(Math.asin(
    Math.sin(beta) * Math.cos(epsilon) +
    Math.cos(beta) * Math.sin(epsilon) * Math.sin(lambda)
  ));
  return raDecToAltAz((ra + 360) % 360, dec, lat, lon);
}

function getSunPosition(lat, lon) {
  const n = getJulianDate() - 2451545.0;
  const L = (280.460 + 0.9856474 * n) % 360;
  const g = toRad((357.528 + 0.9856003 * n) % 360);
  const lambda = toRad(L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g));
  const eps = toRad(23.439 - 0.0000004 * n);
  const ra = (toDeg(Math.atan2(Math.cos(eps) * Math.sin(lambda), Math.cos(lambda))) + 360) % 360;
  const dec = toDeg(Math.asin(Math.sin(eps) * Math.sin(lambda)));
  return raDecToAltAz(ra, dec, lat, lon);
}

// 행성 궤도 요소 (JPL 근사식, 1800~2050년용)
// 순서: a, a변화율, e, e변화율, I, I변화율, L, L변화율, 근일점경도, 변화율, 승교점경도, 변화율 (변화율은 세기당)
const ORBITS = {
  earth:   [1.00000261, 0.00000562, 0.01671123, -0.00004392, -0.00001531, -0.01294668, 100.46457166, 35999.37244981, 102.93768193, 0.32327364, 0.0, 0.0],
  venus:   [0.72333566, 0.00000390, 0.00677672, -0.00004107, 3.39467605, -0.00078890, 181.97909950, 58517.81538729, 131.60246718, 0.00268329, 76.67984255, -0.27769418],
  mars:    [1.52371034, 0.00001847, 0.09339410, 0.00007882, 1.84969142, -0.00813131, -4.55343205, 19140.30268499, -23.94362959, 0.44441088, 49.55953891, -0.29257343],
  mercury: [0.38709927, 0.00000037, 0.20563593, 0.00001906, 7.00497902, -0.00594749, 252.25032350, 149472.67411175, 77.45779628, 0.16047689, 48.33076593, -0.12534081],
  jupiter: [5.20288700, -0.00011607, 0.04838624, -0.00013253, 1.30439695, -0.00183714, 34.39644051, 3034.74612775, 14.72847983, 0.21252668, 100.47390909, 0.20469106],
  saturn:  [9.53667594, -0.00125060, 0.05386179, -0.00050991, 2.48599187, 0.00193609, 49.95424423, 1222.49362201, 92.59887831, -0.41897216, 113.66242448, -0.28867794],
  uranus:  [19.18916464, -0.00196176, 0.04725744, -0.00004397, 0.77263783, -0.00242939, 313.23810451, 428.48202785, 170.95427630, 0.40805281, 74.01692503, 0.04240589],
  neptune: [30.06992276, 0.00026291, 0.00859048, 0.00005105, 1.77004347, 0.00035372, -55.12002969, 218.45945325, 44.96476227, -0.32241464, 131.78422574, -0.00508664],
};

function normDeg(x) { return ((x % 360) + 360) % 360; }

// 태양 중심 황도좌표 (AU)
function heliocentricPos(el, T) {
  const [a0, da, e0, de, I0, dI, L0, dL, w0, dw, O0, dO] = el;
  const a = a0 + da * T;
  const e = e0 + de * T;
  const I = toRad(I0 + dI * T);
  const L = L0 + dL * T;
  const wbar = w0 + dw * T;
  const Om = O0 + dO * T;

  let M = normDeg(L - wbar);
  if (M > 180) M -= 360;
  const Mr = toRad(M);

  // 케플러 방정식 풀이
  let E = Mr + e * Math.sin(Mr);
  for (let i = 0; i < 10; i++) E = Mr + e * Math.sin(E);

  const xv = a * (Math.cos(E) - e);
  const yv = a * Math.sqrt(1 - e * e) * Math.sin(E);

  const w = toRad(wbar - Om), O = toRad(Om);
  const cw = Math.cos(w), sw = Math.sin(w);
  const cO = Math.cos(O), sO = Math.sin(O);
  const cI = Math.cos(I), sI = Math.sin(I);

  return {
    x: (cw * cO - sw * sO * cI) * xv + (-sw * cO - cw * sO * cI) * yv,
    y: (cw * sO + sw * cO * cI) * xv + (-sw * sO + cw * cO * cI) * yv,
    z: (sw * sI) * xv + (cw * sI) * yv,
  };
}

function getPlanetPosition(name, lat, lon) {
  const T = (getJulianDate() - 2451545.0) / 36525;
  const p = heliocentricPos(ORBITS[name], T);
  const earth = heliocentricPos(ORBITS.earth, T);

  // 지구 기준(지심) 황도좌표
  const x = p.x - earth.x, y = p.y - earth.y, z = p.z - earth.z;

  // 황도 → 적도좌표
  const eps = toRad(23.43928);
  const xe = x;
  const ye = y * Math.cos(eps) - z * Math.sin(eps);
  const ze = y * Math.sin(eps) + z * Math.cos(eps);

  const ra = normDeg(toDeg(Math.atan2(ye, xe)));
  const dec = toDeg(Math.atan2(ze, Math.sqrt(xe * xe + ye * ye)));
  return raDecToAltAz(ra, dec, lat, lon);
}

// 달 위상 계산 (정확한 신월 기준점 사용)
// 기준: 2000년 1월 6일 18:14 UTC = JD 2451549.26 (알려진 신월)
function getMoonPhase() {
  const jd = getJulianDate();
  const knownNewMoon = 2451549.26;
  const daysSince = jd - knownNewMoon;
  const cycle = ((daysSince % 29.53059) + 29.53059) % 29.53059;
  // 코사인 공식으로 정확한 조도 계산 (0=신월, 0.5=보름달 전, 1.0=보름달, ...)
  const illumination = (1 - Math.cos(2 * Math.PI * cycle / 29.53059)) / 2;
  // cycle이 14.765 이상이면 보름달 지나서 하현달 방향 (오른쪽에 그림자)
  const waning = cycle > 14.765;
  return { illumination, waning, cycle };
}

function raDecToAltAz(ra, dec, lat, lon) {
  const jd = getJulianDate();
  const T = (jd - 2451545.0) / 36525;

  // 그리니치 항성시 (GMST)
  let GMST = 280.46061837 + 360.98564736629 * (jd - 2451545.0)
    + 0.000387933 * T * T - T * T * T / 38710000;
  GMST = ((GMST % 360) + 360) % 360;

  // 지방 항성시 (LMST)
  const LMST = ((GMST + lon) % 360 + 360) % 360;

  // 시각 (Hour Angle)
  let HA = LMST - ra;
  if (HA < 0) HA += 360;

  const haRad = toRad(HA);
  const decRad = toRad(dec);
  const latRad = toRad(lat);

  // 고도 (Altitude)
  const sinAlt = Math.sin(decRad) * Math.sin(latRad)
    + Math.cos(decRad) * Math.cos(latRad) * Math.cos(haRad);
  const alt = toDeg(Math.asin(sinAlt));

  // 방위각 (Azimuth)
  const cosAz = (Math.sin(decRad) - Math.sin(toRad(alt)) * Math.sin(latRad))
    / (Math.cos(toRad(alt)) * Math.cos(latRad));
  let az = toDeg(Math.acos(Math.max(-1, Math.min(1, cosAz))));
  if (Math.sin(haRad) > 0) az = 360 - az;

  return { alt, az };
}

// =====================
// 6. 화면 좌표 계산
// =====================
function celestialToScreen(objAz, objAlt, camAz, camEl) {
  // 방위각 차이
  let dAz = objAz - camAz;
  if (dAz > 180) dAz -= 360;
  if (dAz < -180) dAz += 360;

  // 고도 차이
  const dEl = objAlt - camEl;

  // 시야각: 좌우 60도, 상하 60도
  const fovH = 60;
  const fovV = 60;

  const px = canvas.width / 2 + (dAz / fovH) * canvas.width;
  const py = canvas.height / 2 - (dEl / fovV) * canvas.height;

  return { px, py };
}

// =====================
// 7. 그리기 함수들
// =====================
function drawStar(x, y, r, brightness, color = '255,255,255') {
  const grad = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
  grad.addColorStop(0, `rgba(${color},${brightness})`);
  grad.addColorStop(1, `rgba(${color},0)`);
  ctx.beginPath();
  ctx.arc(x, y, r * 3, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
}

function drawSunFlat(px, py) {
  const t = performance.now() / 1000;

  // 부드러운 빛
  const glow = ctx.createRadialGradient(px, py, 0, px, py, 140);
  glow.addColorStop(0, 'rgba(255,200,70,0.55)');
  glow.addColorStop(0.35, 'rgba(255,170,50,0.18)');
  glow.addColorStop(1, 'rgba(255,150,40,0)');
  ctx.beginPath();
  ctx.arc(px, py, 140, 0, Math.PI * 2);
  ctx.fillStyle = glow;
  ctx.fill();

  // 천천히 도는 광선 12개
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(t * 0.15);
  ctx.strokeStyle = 'rgba(255,200,60,0.85)';
  ctx.lineCap = 'round';
  ctx.lineWidth = 5;
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const inner = 38;
    const outer = i % 2 === 0 ? 62 : 52;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * inner, Math.sin(a) * inner);
    ctx.lineTo(Math.cos(a) * outer, Math.sin(a) * outer);
    ctx.stroke();
  }
  ctx.restore();

  // 단색 원
  ctx.beginPath();
  ctx.arc(px, py, 28, 0, Math.PI * 2);
  ctx.fillStyle = '#ffc83d';
  ctx.fill();
}

function drawMoonFlat(px, py, r, illumination, waning) {
  // 빛번짐
  const glow = ctx.createRadialGradient(px, py, r * 0.8, px, py, r + 45);
  glow.addColorStop(0, 'rgba(235,235,210,0.22)');
  glow.addColorStop(1, 'rgba(235,235,210,0)');
  ctx.beginPath();
  ctx.arc(px, py, r + 45, 0, Math.PI * 2);
  ctx.fillStyle = glow;
  ctx.fill();

  ctx.save();
  ctx.beginPath();
  ctx.arc(px, py, r, 0, Math.PI * 2);
  ctx.clip();

  // 단색 달 + 크레이터
  ctx.fillStyle = '#f1ead0';
  ctx.fillRect(px - r, py - r, r * 2, r * 2);
  ctx.fillStyle = 'rgba(190,180,150,0.35)';
  [[-0.3, -0.25, 0.18], [0.25, 0.1, 0.22], [-0.1, 0.42, 0.12], [0.38, -0.42, 0.1]]
    .forEach(([cx, cy, cr]) => {
      ctx.beginPath();
      ctx.arc(px + cx * r, py + cy * r, cr * r, 0, Math.PI * 2);
      ctx.fill();
    });

  // 위상 그림자 (기존 로직 그대로, 경계만 부드럽게)
  const path = () => {
    ctx.beginPath();
    if (!waning) {
      ctx.arc(px, py, r, Math.PI / 2, -Math.PI / 2, false);
      const ex = r * (1 - 2 * illumination);
      ctx.ellipse(px, py, Math.abs(ex), r, 0, -Math.PI / 2, Math.PI / 2, ex > 0);
    } else {
      ctx.arc(px, py, r, -Math.PI / 2, Math.PI / 2, false);
      const ex = r * (2 * illumination - 1);
      ctx.ellipse(px, py, Math.abs(ex), r, 0, Math.PI / 2, -Math.PI / 2, ex > 0);
    }
    ctx.closePath();
  };

  path();
  ctx.fillStyle = 'rgba(0,5,12,0.88)';
  ctx.fill();
  // 경계 번짐: 굵기를 키우며 옅게 여러 번 덧칠
  ctx.strokeStyle = 'rgba(0,5,12,0.12)';
  for (let w = 3; w <= 15; w += 3) {
    ctx.lineWidth = w;
    path();
    ctx.stroke();
  }

  ctx.restore();
}

function drawPlanetFlat(px, py, r, color, glowColor, label, ring = false) {
  const glow = ctx.createRadialGradient(px, py, 0, px, py, r * 5);
  glow.addColorStop(0, `rgba(${glowColor},0.45)`);
  glow.addColorStop(1, `rgba(${glowColor},0)`);
  ctx.beginPath();
  ctx.arc(px, py, r * 5, 0, Math.PI * 2);
  ctx.fillStyle = glow;
  ctx.fill();

  const drawRing = (from, to) => {
    ctx.beginPath();
    ctx.ellipse(px, py, r * 2.2, r * 0.7, -0.35, from, to);
    ctx.strokeStyle = 'rgba(230,205,140,0.85)';
    ctx.lineWidth = 2.5;
    ctx.stroke();
  };

  if (ring) drawRing(Math.PI, Math.PI * 2); // 고리 뒤쪽 절반
  ctx.beginPath();
  ctx.arc(px, py, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  if (ring) drawRing(0, Math.PI);           // 고리 앞쪽 절반

  ctx.fillStyle = 'rgba(180,220,255,0.7)';
  ctx.font = '12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(label, px, py + r + 18);
}

// 화면 = 우주 영역(위 80%, 움직임) + 지구 영역(아래 20%, 고정)
const panelTop = () => canvas.height * HORIZON_STOP;

// 지구 영역: 화면에 고정. 뒤에서 움직이는 별·행성을 가리고 지구본을 그림
function drawEarthPanel() {
  const top = panelTop();
  ctx.fillStyle = '#000508';
  ctx.fillRect(0, top, canvas.width, canvas.height - top);
  drawGlobe();

  // 경계선: 실제 지평선과 겹칠 때(지평선 쪽을 볼 때) 밝게 빛나고 '지평선' 표시
  // 위를 볼 때는 실제 지평선이 지구 영역 뒤로 내려가므로 은은한 구분선으로만
  const horizonY = celestialToScreen(0, 0, azimuth, elevation).py;
  const onHorizon = 1 - Math.min(1, Math.max(0, (horizonY - top) / 60));

  const glow = ctx.createLinearGradient(0, top - 24, 0, top);
  glow.addColorStop(0, 'rgba(140,200,255,0)');
  glow.addColorStop(1, `rgba(140,200,255,${0.25 * onHorizon})`);
  ctx.fillStyle = glow;
  ctx.fillRect(0, top - 24, canvas.width, 24);

  const lineGrad = ctx.createLinearGradient(0, 0, canvas.width, 0);
  const a = 0.3 + 0.6 * onHorizon;
  lineGrad.addColorStop(0, 'rgba(180,225,255,0)');
  lineGrad.addColorStop(0.15, `rgba(180,225,255,${a})`);
  lineGrad.addColorStop(0.85, `rgba(180,225,255,${a})`);
  lineGrad.addColorStop(1, 'rgba(180,225,255,0)');
  ctx.beginPath();
  ctx.moveTo(0, top);
  ctx.lineTo(canvas.width, top);
  ctx.strokeStyle = lineGrad;
  ctx.lineWidth = 1 + onHorizon;
  ctx.stroke();

  if (onHorizon > 0.05) {
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = `rgba(180,225,255,${0.7 * onHorizon})`;
    ctx.fillText('지평선', 16, top + 14);
  }

  // 방위 표시: 경계선 바로 위, 지금 보는 방향에 맞춰 좌우로만 이동
  ctx.font = '13px monospace';
  ctx.textAlign = 'center';
  [['북', 0], ['북동', 45], ['동', 90], ['남동', 135], ['남', 180], ['남서', 225], ['서', 270], ['북서', 315]].forEach(([label, az]) => {
    const { px } = celestialToScreen(az, 0, azimuth, elevation);
    if (px < -20 || px > canvas.width + 20) return;
    const main = label.length === 1;
    ctx.fillStyle = label === '북' ? 'rgba(255,122,107,0.9)'
                  : main ? 'rgba(180,220,255,0.6)' : 'rgba(180,220,255,0.3)';
    ctx.font = main ? '13px monospace' : '10px monospace';
    ctx.fillText(label, px, top - 10);
  });
}


// =====================
// 지구 반구: 화면 아래 가운데 고정, 내 위치(GPS) 표시
// =====================
// GLOBE_SHOW: 원 지름의 몇 %가 화면에 보일지 (0.5 = 반구, 0.25 = 반의반구 느낌)
const GLOBE_SHOW = 0.28;
// 지구 밝기 (1 = 원래 색, 낮출수록 어두움). 밤하늘에서 눈부시지 않게 낮춤
const EARTH_BRIGHTNESS = 0.6;

function globeGeom() {
  // 지구본은 아래 20%(지구 영역) 안에 들어가는 크기로
  // 보이는 높이는 아래 20%로 고정, GLOBE_SHOW가 작을수록 큰 지구의 윗부분만 보여 곡선이 완만해짐
  const R = Math.min(canvas.width * 1.2, canvas.height * (1 - HORIZON_STOP) / (2 * GLOBE_SHOW));
  const cx = canvas.width / 2;
  const cy = canvas.height + R - 2 * R * GLOBE_SHOW;
  return { R, cx, cy };
}

// 정사영(orthographic) 투영: 지구를 멀리서 본 모습
// 중심을 내 위치보다 남쪽에 두어, 내 위치가 보이는 부분 한가운데쯤 오게 함
const globeLatShift = () => toDeg(Math.asin(1 - GLOBE_SHOW));
function globeProject(lon, lat, g) {
  const lat0 = toRad(userLat - globeLatShift()), lon0 = toRad(userLon);
  const p = toRad(lat), dl = toRad(lon) - lon0;
  const cosc = Math.sin(lat0) * Math.sin(p) + Math.cos(lat0) * Math.cos(p) * Math.cos(dl);
  let x = Math.cos(p) * Math.sin(dl);
  let y = Math.cos(lat0) * Math.sin(p) - Math.sin(lat0) * Math.cos(p) * Math.cos(dl);
  const front = cosc >= 0;
  if (!front) { const k = 1 / (Math.hypot(x, y) || 1); x *= k; y *= k; }  // 뒷면은 테두리로 밀어냄
  return { x: g.cx + x * g.R, y: g.cy - y * g.R, front };
}

// 지구본 그림은 위치가 바뀔 때만 새로 만들고, 평소엔 저장해둔 그림을 재사용
let globeCache = null;

function buildGlobeImage(g) {
  // 1) 평면 세계지도(가로=경도, 세로=위도)에 대륙을 흰색으로 칠함
  const mw = 2048, mh = 1024;   // 지구가 크게 보이니 해안선이 계단지지 않게 고해상도로
  const map = document.createElement('canvas');
  map.width = mw; map.height = mh;
  const m = map.getContext('2d');
  m.fillStyle = '#fff';
  LAND.forEach(r => {
    m.beginPath();
    for (let i = 0; i < r.length; i += 2) {
      const x = (r[i] + 180) / 360 * mw, y = (90 - r[i + 1]) / 180 * mh;
      i === 0 ? m.moveTo(x, y) : m.lineTo(x, y);
    }
    m.fill();
  });
  const land = m.getImageData(0, 0, mw, mh).data;

  // 2) 지구본의 픽셀마다 '이 점은 지구의 어느 위경도인가'를 거꾸로 계산(역정사영)해서 색을 가져옴
  const size = Math.ceil(g.R * 2);
  const out = document.createElement('canvas');
  out.width = size; out.height = size;
  const o = out.getContext('2d');
  const img = o.createImageData(size, size);
  const lat0 = toRad(userLat - globeLatShift()), lon0 = toRad(userLon);
  const s0 = Math.sin(lat0), c0 = Math.cos(lat0);
  // 달과 같은 플랫 일러스트 색상
  const SEA = [61, 124, 201], LAND_C = [140, 196, 122], ICE = [236, 243, 247], CLOUD = [255, 255, 255];
  const mla = toRad(userLat), mlo = toRad(userLon);
  const meX = Math.cos(mla) * Math.cos(mlo), meY = Math.cos(mla) * Math.sin(mlo), meZ = Math.sin(mla);
  const smooth = (a, b, t) => { const k = Math.min(1, Math.max(0, (t - a) / (b - a))); return k * k * (3 - 2 * k); };

  const visibleRows = Math.min(size, Math.ceil(canvas.height - (g.cy - g.R)) + 1);   // 화면 밖 아래쪽은 계산 생략
  for (let py = 0; py < visibleRows; py++) {
    for (let px = 0; px < size; px++) {
      const x = (px + 0.5 - g.R) / g.R, y = (g.R - (py + 0.5)) / g.R;
      const rho2 = x * x + y * y;
      if (rho2 > 1) continue;
      const z = Math.sqrt(1 - rho2);                       // 화면 쪽을 향한 정도 (가장자리 0, 가운데 1)
      const lat = Math.asin(z * s0 + y * c0);
      const lon = lon0 + Math.atan2(x, z * c0 - y * s0);
      let u = Math.floor(((toDeg(lon) + 540) % 360) / 360 * mw);
      let v = Math.floor((90 - toDeg(lat)) / 180 * mh);
      v = Math.min(mh - 1, Math.max(0, v));
      const isLand = land[(v * mw + u) * 4] > 128;
      const latD = toDeg(lat);
      // 극지방은 얼음 (바다는 75°, 육지는 66° 위부터), 경계는 부드럽게
      const ice = smooth(isLand ? 62 : 72, isLand ? 70 : 80, Math.abs(latD));
      let c = isLand ? LAND_C : SEA;
      c = [0, 1, 2].map(j => c[j] + (ICE[j] - c[j]) * ice);

      // 구름: 지구 표면에 붙은 무늬 (3차원 좌표로 만들어 이음매 없음)
      const X = Math.cos(lat) * Math.cos(lon), Y = Math.cos(lat) * Math.sin(lon), Z = Math.sin(lat);
      const n = Math.sin(13.1 * X + 4.3 * Z) * Math.sin(11.3 * Y - 3.7 * X)
              + 0.6 * Math.sin(23.7 * Z + 8.1 * Y) * Math.sin(19.4 * X + 3.2)
              + 0.35 * Math.sin(37.3 * Y + 15.7 * Z);
      // 내 위치 주변(약 12°)은 구름이 비켜감
      const dMe = Math.acos(Math.min(1, X * meX + Y * meY + Z * meZ));
      const cloud = 0.8 * smooth(0.85, 1.05, n) * smooth(0.12, 0.25, dMe);
      c = [0, 1, 2].map(j => c[j] + (CLOUD[j] - c[j]) * cloud);

      // 플랫 스타일: 음영 대신 가장자리만 살짝 어둡게
      const k = (0.78 + 0.22 * Math.sqrt(z)) * EARTH_BRIGHTNESS;
      const i = (py * size + px) * 4;
      img.data[i]     = Math.min(255, c[0] * k);
      img.data[i + 1] = Math.min(255, c[1] * k);
      img.data[i + 2] = Math.min(255, c[2] * k);
      img.data[i + 3] = 255;
    }
  }
  o.putImageData(img, 0, 0);
  return out;
}

function drawGlobe() {
  const g = globeGeom();

  // 대기 빛
  const air = ctx.createRadialGradient(g.cx, g.cy, g.R * 0.95, g.cx, g.cy, g.R * 1.15);
  air.addColorStop(0, `rgba(140,200,255,${0.45 * EARTH_BRIGHTNESS})`);
  air.addColorStop(1, 'rgba(140,200,255,0)');
  ctx.beginPath();
  ctx.arc(g.cx, g.cy, g.R * 1.15, 0, Math.PI * 2);
  ctx.fillStyle = air;
  ctx.fill();

  // 지구본 그림 (위치나 화면 크기가 바뀌었을 때만 다시 만듦)
  const key = `${userLat.toFixed(2)},${userLon.toFixed(2)},${g.R}`;
  if (!globeCache || globeCache.key !== key) globeCache = { key, img: buildGlobeImage(g) };
  ctx.drawImage(globeCache.img, g.cx - g.R, g.cy - g.R);

  // 대기권 테두리: 지구 가장자리를 따라 얇게 빛나는 선
  ctx.beginPath();
  ctx.arc(g.cx, g.cy, g.R + 1, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(170,220,255,${0.7 * EARTH_BRIGHTNESS})`;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // 내 위치
  const me = globeProject(userLon, userLat, g);
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 400);
  ctx.beginPath();
  ctx.arc(me.x, me.y, 6 + pulse * 6, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255,122,107,${0.35 * (1 - pulse)})`;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(me.x, me.y, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#ff7a6b';
  ctx.fill();
  ctx.fillStyle = 'rgba(220,240,255,0.85)';
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,10,25,0.9)';
  ctx.shadowBlur = 4;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(gpsReady ? '내 위치' : '서울(기본값)', me.x, me.y - 12);
  ctx.shadowBlur = 0;
}

// =====================
// 배경 별 + 별자리
// =====================
// 이름 있는 별(STARS)과 겹치는 배경 별은 건너뜀 (두 번 그려져 더 밝아 보이는 것 방지)
const NAMED_KEYS = new Set(STARS.map(st => st.ra.toFixed(1) + ',' + st.dec.toFixed(1)));

function drawBgStars() {
  for (let i = 0; i < BG_STARS.length; i += 3) {
    const mag = BG_STARS[i + 2];
    if (NAMED_KEYS.has(BG_STARS[i].toFixed(1) + ',' + BG_STARS[i + 1].toFixed(1))) continue;
    const { alt, az } = raDecToAltAz(BG_STARS[i], BG_STARS[i + 1], userLat, userLon);
    if (alt < -5) continue;
    const { px, py } = celestialToScreen(az, alt, azimuth, elevation);
    if (px < -10 || px > canvas.width + 10 || py < -10 || py > canvas.height + 10) continue;
    const r = Math.max(0.5, 2.5 - mag * 0.45);
    const brightness = Math.max(0.25, 0.9 - (mag - 2.5) * 0.25);
    drawStar(px, py, r, brightness);
  }
}

// 별자리 표시 켜기/끄기 (선택은 이 브라우저에 기억)
let showConstellations = true;
try { showConstellations = localStorage.getItem('showConstellations') !== '0'; } catch (e) {}
const constBtn = document.getElementById('constBtn');
constBtn.classList.toggle('off', !showConstellations);
constBtn.addEventListener('click', () => {
  showConstellations = !showConstellations;
  constBtn.classList.toggle('off', !showConstellations);
  try { localStorage.setItem('showConstellations', showConstellations ? '1' : '0'); } catch (e) {}
});

function drawConstellations() {
  const W = canvas.width, H = canvas.height;
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(140,190,255,0.28)';
  CONSTELLATIONS.forEach(c => {
    let visible = false;
    c.lines.forEach(seg => {
      let prev = null;
      for (let i = 0; i < seg.length; i += 2) {
        const { alt, az } = raDecToAltAz(seg[i], seg[i + 1], userLat, userLon);
        const p = { ...celestialToScreen(az, alt, azimuth, elevation), alt };
        if (prev && (prev.alt > -5 || p.alt > -5)) {
          const onScreen = (q) => q.px > -W * 0.5 && q.px < W * 1.5 && q.py > -H * 0.5 && q.py < H * 1.5;
          // 화면 뒤쪽을 넘어가는 선(방위각 ±180° 경계)은 화면을 가로지르므로 생략
          if ((onScreen(prev) || onScreen(p)) && Math.abs(prev.px - p.px) < W) {
            ctx.beginPath();
            ctx.moveTo(prev.px, prev.py);
            ctx.lineTo(p.px, p.py);
            ctx.stroke();
            visible = true;
          }
        }
        prev = p;
      }
    });

    // 이름: 유명한 별자리(rank 1, 2)만, 선이 보일 때
    if (!visible || c.rank > 2) return;
    const { alt, az } = raDecToAltAz(c.label[0], c.label[1], userLat, userLon);
    if (alt < 0) return;
    const { px, py } = celestialToScreen(az, alt, azimuth, elevation);
    ctx.font = c.rank === 1 ? '12px monospace' : '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = c.rank === 1 ? 'rgba(160,200,255,0.6)' : 'rgba(160,200,255,0.4)';
    ctx.fillText(c.ko, px, py);
  });
}

// 선택한 천체 주위에 천천히 숨쉬는 링
function drawSelection() {
  if (!selected) return;
  const t = hitTargets.find(h => h.name === selected.name);
  if (!t || t.py > panelTop()) return;   // 화면 밖이거나 지평선 아래면 링 생략 (정보창은 유지)
  const pulse = 1 + 0.08 * Math.sin(performance.now() / 300);
  ctx.beginPath();
  // 링 크기 = 탭 범위 (보이는 원 안을 누르면 선택됨). 숨쉬기는 안쪽으로만
  ctx.arc(t.px, t.py, t.ringR * (pulse - 0.08), 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(180,220,255,0.8)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

// 탭 범위 디버그 표시
function drawTapDebug() {
  ctx.save();
  ctx.setLineDash([3, 4]);
  ctx.strokeStyle = 'rgba(255,255,120,0.35)';
  ctx.lineWidth = 1;
  hitTargets.forEach(t => {
    ctx.beginPath();
    ctx.arc(t.px, t.py, t.hitR, 0, Math.PI * 2);
    ctx.stroke();
  });
  ctx.restore();
  // 마지막 탭 지점 (1.5초 동안)
  if (lastTap && performance.now() - lastTap.t < 1500) {
    ctx.beginPath();
    ctx.arc(lastTap.x, lastTap.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,80,80,0.9)';
    ctx.fill();
  }
}

// 행성 스타일 (r: 점 반지름, glow: 빛번짐 RGB)
const PLANET_STYLE = [
  { key: 'mercury', label: '수성',   r: 4, color: '#b9b2a8', glow: '200,195,185' },
  { key: 'venus',   label: '금성',   r: 6, color: '#fff2b0', glow: '255,240,170' },
  { key: 'mars',    label: '화성',   r: 5, color: '#e0583a', glow: '255,110,70'  },
  { key: 'jupiter', label: '목성',   r: 8, color: '#e8c9a0', glow: '240,200,150' },
  { key: 'saturn',  label: '토성',   r: 6, color: '#e6d28a', glow: '230,210,140', ring: true },
  { key: 'uranus',  label: '천왕성', r: 4, color: '#9fe3e6', glow: '150,230,235' },
  { key: 'neptune', label: '해왕성', r: 4, color: '#5b7cff', glow: '100,130,255' },
];

// =====================
// 8. 메인 루프
// =====================
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 방위각 경계 처리
  let diff = targetAz - azimuth;
  if (diff > 180) diff -= 360;
  if (diff < -180) diff += 360;
  azimuth += diff * 0.2;
  if (azimuth < 0) azimuth += 360;
  if (azimuth >= 360) azimuth -= 360;
  elevation = targetEl;
  updateHud();
  hitTargets = [];   // 이번 프레임에 탭할 수 있는 천체 목록


  // 배경 별(4.5등급까지, 점만) → 별자리 선 → 이름 있는 별 순서로 그림
  drawBgStars();
  if (showConstellations) drawConstellations();

  // 별 그리기
  STARS.forEach(star => {
    const { alt, az } = raDecToAltAz(star.ra, star.dec, userLat, userLon);
    if (alt < -10) return; // 지평선 아래 10도 이상은 생략

    const { px, py } = celestialToScreen(az, alt, azimuth, elevation);

    // 화면 밖이면 생략
    if (px < -20 || px > canvas.width + 20 || py < -20 || py > canvas.height + 20) return;

    // 등급 → 크기/밝기 변환 (mag 작을수록 밝음)
    const r = Math.max(0.5, 2.5 - star.mag * 0.5);
    const brightness = Math.max(0.3, 1.0 - star.mag * 0.1);

    drawStar(px, py, r, brightness);
    if (alt > 0) hitTargets.push({
      name: star.name, kind: star.ko ? `별 · ${star.ko}` : '별', px, py, hitR: 22, coreR: 8, ringR: 22,
      getPos: () => raDecToAltAz(star.ra, star.dec, userLat, userLon),
    });
  });

  // 행성 그리기
  PLANET_STYLE.forEach(pl => {
    const pos = getPlanetPosition(pl.key, userLat, userLon);
    if (TEST_MODE) { pos.alt = TEST_POS[pl.key].alt; pos.az = TEST_POS[pl.key].az; }
    if (pos.alt < -10) return;
    const { px, py } = celestialToScreen(pos.az, pos.alt, azimuth, elevation);
    if (px < -50 || px > canvas.width + 50 || py < -50 || py > canvas.height + 50) return;
    drawPlanetFlat(px, py, pl.r, pl.color, pl.glow, pl.label, pl.ring);
    if (pos.alt > 0) hitTargets.push({
      name: pl.label, kind: '행성', px, py, hitR: Math.max(22, pl.r * 3.5), coreR: pl.r + 6, ringR: Math.max(22, pl.r * 3.5),
      getPos: () => TEST_MODE ? { ...TEST_POS[pl.key] } : getPlanetPosition(pl.key, userLat, userLon),
    });
  });

  // 태양 그리기
  const sun = getSunPosition(userLat, userLon);
  if (TEST_MODE) { sun.alt = TEST_POS.sun.alt; sun.az = TEST_POS.sun.az; }
  if (sun.alt > -10) {
    const { px, py } = celestialToScreen(sun.az, sun.alt, azimuth, elevation);
    if (px > -150 && px < canvas.width + 150 && py > -150 && py < canvas.height + 150) {
      drawSunFlat(px, py);
      if (sun.alt > 0) hitTargets.push({
        name: '태양', kind: '항성', px, py, hitR: 55, coreR: 30, ringR: 55,
        getPos: () => TEST_MODE ? { ...TEST_POS.sun } : getSunPosition(userLat, userLon),
      });
    }
  }

  // 달 그리기
  const moon = getMoonPosition(userLat, userLon);
  if (TEST_MODE) { moon.alt = TEST_POS.moon.alt; moon.az = TEST_POS.moon.az; }
  if (moon.alt > -10) {
    const { px, py } = celestialToScreen(moon.az, moon.alt, azimuth, elevation);
    if (px > -100 && px < canvas.width + 100 && py > -100 && py < canvas.height + 100) {
      const { illumination, waning } = getMoonPhase();
      drawMoonFlat(px, py, 30, illumination, waning);
      if (moon.alt > 0) hitTargets.push({
        name: '달', kind: '위성', px, py, hitR: 45, coreR: 30, ringR: 45,
        getPos: () => TEST_MODE ? { ...TEST_POS.moon } : getMoonPosition(userLat, userLon),
      });
    }
  }

  // 지구 영역은 맨 마지막에: 화면 아래 20%에 고정, 뒤의 천체를 가림
  drawEarthPanel();
  drawSelection();
  if (DEBUG_TAP) drawTapDebug();

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
