<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>별 어디있니</title>
  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #000508;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }

  #scope {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2.5rem;
  }

  #hud {
    position: fixed;
    top: 20px;
    left: 20px;
    color: rgba(180, 220, 255, 0.8);
    font-family: monospace;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  #dir {
    font-size: 1.4rem;
    font-weight: 300;
    letter-spacing: 0.2em;
  }

  #coords {
    font-size: 0.75rem;
    opacity: 0.6;
  }
</style>
</head>
<body>

  <!-- 하늘 캔버스 -->
  <canvas id="sky"></canvas>

  <!-- 고정된 망원경 -->
  <div id="scope">🔭</div>

  <!-- 상단 정보 -->
  <div id="hud">
    <span id="dir">N</span>
    <span id="coords">Az 0° · El 45°</span>
  </div>
<script>
  // 1. 캔버스 준비
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');

  // 2. 캔버스를 화면 크기에 맞추는 함수
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  resize();
  window.addEventListener('resize', resize);
    // 3. 테스트용 별 데이터
  const stars = [
    { x: 0.2, y: 0.3, r: 2, brightness: 1.0 },
    { x: 0.5, y: 0.2, r: 1.5, brightness: 0.8 },
    { x: 0.7, y: 0.4, r: 3, brightness: 1.0 },
    { x: 0.3, y: 0.6, r: 1, brightness: 0.6 },
    { x: 0.8, y: 0.15, r: 2.5, brightness: 0.9 },
  ];
   // 4. 별 하나를 그리는 함수
  function drawStar(x,y,r,brightness)
  {
    const grad = ctx. createRadialGradient(x,y,0,x,y,r*3);
    grad.addColorStop(0,`rgba(255,255,255,${brightness})`);
    grad.addColorStop(1, `rgba(255,255,255,0)`);

    ctx.beginPath();
    ctx.arc(x,y,r*3,0,Math.PI *2);
    ctx.fillStyle = grad;
    ctx.fill();
  }
  // 5. 화면 전체를 그리는 함수
  function draw()
  {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    stars.forEach(star => {
      const px = star.x * canvas.width;
      const py = star.y * canvas.height;
      drawStar(px,py,star.r,star.brightness);
    });
    
    requestAnimationFrame(draw);
  }
  
  draw();
</script>
</body>
</html>
